name: resume_analyzer
description: AI Resume Analyzer - analyzes CVs and suggests improvements and missing skills.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  file_picker: ^13.0.0
  syncfusion_flutter_pdf: any
  http: any

  material_ui: any
  flutter_dotenv: ^6.0.2
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"